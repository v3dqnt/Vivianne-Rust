[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/attachments",
    "crates/context",
    "crates/runtime",
    "crates/providers",
    "crates/tools",
    "crates/plugins",
    "crates/app-api",
    "crates/cli",
    "crates/ai",
    "crates/telemetry",
    "crates/memory",
    "crates/multiplayer",
    "crates/remote",
    "crates/shell",
    "crates/projects",
    "crates/hub",
    "crates/sandbox",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "io-std", "sync"] }
reqwest = { version = "0.13", features = ["json", "stream"] }

vivianne-core = { path = "crates/core" }
vivianne-runtime = { path = "crates/runtime" }
vivianne-providers = { path = "crates/providers" }
vivianne-ai = { path = "crates/ai" }
vivianne-telemetry = { path = "crates/telemetry" }
vivianne-memory = { path = "crates/memory" }
vivianne-multiplayer = { path = "crates/multiplayer" }
vivianne-remote = { path = "crates/remote" }
vivianne-tools = { path = "crates/tools" }
vivianne-plugins = { path = "crates/plugins" }
vivianne-app-api = { path = "crates/app-api" }
vivianne-projects = { path = "crates/projects" }
vivianne-sandbox = { path = "crates/sandbox" }

# gpui-component's Settings dialog is restyled (a flat sidebar, a real page header, headings that read as headings).
# Vendored from 0.9.1 with those changes only; see vendor/gpui-component/README.md.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[workspace.lints.rust]
# deny, not forbid: only the shell's Windows glue may opt in with #[allow(unsafe_code)].
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Build profiles: small target/ and quick rebuilds in development, an optimized binary for release.
[profile.dev]
opt-level = 0
# File and line for backtraces, without full debug info (a large share of target/).
debug = "line-tables-only"
incremental = true

# Dependencies carry no debug info; `cargo build --profile debugging` has it all when a debugger is needed.
[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
