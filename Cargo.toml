[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/runtime",
    "crates/providers",
    "crates/tools",
    "crates/plugins",
    "crates/app-api",
    "crates/cli",
    "crates/ai",
    "crates/shell",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "io-std", "sync"] }
reqwest = { version = "0.13", features = ["json", "stream"] }

vivianne-core = { path = "crates/core" }
vivianne-runtime = { path = "crates/runtime" }
vivianne-providers = { path = "crates/providers" }
vivianne-tools = { path = "crates/tools" }
vivianne-plugins = { path = "crates/plugins" }
vivianne-app-api = { path = "crates/app-api" }

[workspace.lints.rust]
# deny, not forbid: only the shell's Windows glue may opt in with #[allow(unsafe_code)].
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
