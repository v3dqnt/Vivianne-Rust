[package]
name = "vivianne-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "viv-hub"
path = "src/main.rs"

[dependencies]
vivianne-projects.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
# The same SQLite the memory crate bundles, so there is one in the tree.
rusqlite = { version = "0.32", features = ["bundled"] }
# The HTTP server. All three are already in the tree under the HTTP client; a web framework is not, and is not needed.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes.workspace = true
# Tokens and ids come from the operating system's randomness; only a token's hash is kept.
rand = "0.9"
sha2 = "0.10"

[dev-dependencies]
vivianne-projects = { workspace = true, features = ["scenarios"] }

[lints]
workspace = true
