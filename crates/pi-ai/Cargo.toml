[package]
name = "vivianne-pi-ai"
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true

[lib]
name = "pi_ai"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io", "codec"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }
thiserror = "2"
bytes = "1"
regex = "1"
url = "2"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing = "0.1"
once_cell = "1"
indexmap = { version = "2", features = ["serde"] }
dashmap = "6"
hex = "0.4"
percent-encoding = "2"
prost = "0.13"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints.rust]
warnings = "allow"

[lints.clippy]
all = "allow"
pedantic = "allow"
