[package]
name = "vivianne-ai"
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Dependency versions match the old backend, which the copied provider layer was written against.
[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
futures.workspace = true
async-trait.workspace = true
reqwest = { version = "0.13.3", features = ["json", "stream"] }
log = "0.4"
dirs = "6.0.0"
base64 = "0.22.1"
rand = "0.9.4"
sha2 = "0.10.9"
hmac = "0.12.1"
lazy_static = "1.5.0"
regex = "1.12.4"
url = "2.5.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
async-stream = "0.3.6"
open = "5"

# The copied files are the old app's code and keep its style, so the strict
# workspace lints do not apply to this crate.
[lints.rust]
warnings = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
