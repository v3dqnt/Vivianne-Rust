[package]
name = "vivianne-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Dependency versions match the original Vivianne backend, which the copied
# tools were written against.
[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
futures.workspace = true
reqwest.workspace = true
regex = "1.12.4"
url = "2.5.8"
base64 = "0.22.1"
sha2 = "0.10.9"
image = "0.25"
which = "7.0"
similar = "2"
dirs = "6.0.0"
toml = "0.8"
log = "0.4"
lazy_static = "1.5"
uuid = { version = "1", features = ["v4"] }
zip = "4.2"
lopdf = "0.34"
quick-xml = "0.37"
rust_xlsxwriter = "0.92"
docx-rs = "0.4"
printpdf = "0.11"
calamine = "0.38"

[lints]
workspace = true
