[package]
name = "vivianne-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "vivianne"
path = "src/main.rs"

[[bin]]
name = "spike_transcript"
path = "src/bin/spike_transcript.rs"

[[bin]]
name = "spike_overlay"
path = "src/bin/spike_overlay.rs"

[[bin]]
name = "spike_terminal"
path = "src/bin/spike_terminal.rs"

[dependencies]
vivianne-core.workspace = true
vivianne-providers.workspace = true
vivianne-runtime.workspace = true
vivianne-tools.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
serde_json.workspace = true
# One exact version, upgraded deliberately (ADR 0016).
gpui = "=0.2.2"
raw-window-handle = "0.6"
alacritty_terminal = "0.25"

[target.'cfg(windows)'.dependencies]
# Same version gpui uses, so nothing extra compiles.
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
